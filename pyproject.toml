[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backloggd-py"
version = "0.1.0"
description = "Fast, typed async & sync Python SDK, web scraper, and taste-matching engine for Backloggd."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Arda" }
]
keywords = [
    "backloggd",
    "video-games",
    "scraper",
    "sdk",
    "taste-matcher",
    "recommendation-engine",
    "letterboxd",
    "gaming",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx[http2]>=0.28.1",
    "beautifulsoup4>=4.12.0",
    "lxml>=6.1.3",
]

[project.urls]
Homepage = "https://github.com/ardax12/backloggd-matcher"
Documentation = "https://github.com/ardax12/backloggd-matcher#readme"
Repository = "https://github.com/ardax12/backloggd-matcher"
Issues = "https://github.com/ardax12/backloggd-matcher/issues"
Changelog = "https://github.com/ardax12/backloggd-matcher/releases"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/backloggd"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]
